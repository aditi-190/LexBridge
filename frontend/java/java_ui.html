<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexBridge | Java Lexical Analyzer</title>
    <link rel="stylesheet" href="java_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="navbar">
        <div class="navbar-left">
            <div class="logo-badge">L</div>
            <div class="navbar-titles">
                <div class="logo">LexBridge</div>
                <div class="subtitle">Interactive Compiler Workspace</div>
            </div>
        </div>

        <div class="language-badge">
            <span class="label">Language:</span>
            <span class="value">Java</span>
            <span class="chevron">▼</span>
        </div>
    </div>

    <div class="container">
        <div class="editor">
            <div class="card-header">
                <h2>Source Code</h2>
                <span class="file-tag">main.java</span>
            </div>
            <textarea id="code" placeholder="int add(int a,int b){return a+b;} int x = add(5,3);"></textarea>
            <div class="editor-footer">
                <span class="hint">Write your code and click Run Code.</span>
                <button id="runBtn">▶ Run Code</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="input-box">
                <div class="card-header">
                    <h2>Program Input</h2>
                </div>
                <textarea id="input" placeholder="Enter Input"></textarea>
            </div>

            <div class="output-box">
                <div class="terminal-header">
                    <div class="terminal-header-left">
                        <div class="dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span class="terminal-title">Terminal / Output</span>
                    </div>
                    <span class="status-badge idle">Idle</span>
                </div>
                <div class="tab-content active" id="outputTab">
                    <pre id="output">Compilation status will appear here...</pre>
                </div>
            </div>
        </div>
    </div>

    <script src="java_script.js"></script>
</body>
</html>

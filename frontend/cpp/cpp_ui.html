<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LexBridge | C++ Compiler</title>

    <link rel="stylesheet" href="cpp_style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="app">

        <!-- TOP NAVBAR -->

        <header class="navbar">

            <div class="brand-section">

                <div class="brand-icon">

                    L

                </div>

                <div class="brand-info">

                    <div class="brand-name">

                        LexBridge

                    </div>

                    <div class="brand-subtitle">

                        Interactive Compiler Workspace

                    </div>

                </div>

            </div>


            <div class="navbar-right">

                <div class="language-selector">

                    <button
                        id="languageBtn"
                        class="language-btn"
                        type="button">

                        Language:
                        <span id="currentLanguage">
                            C++
                        </span>

                        <span class="arrow">
                            ▼
                        </span>

                    </button>

                    <div
                        id="languageMenu"
                        class="language-menu">

                        <button
                            class="language-option"
                            data-language="c"
                            type="button">

                            C

                        </button>

                        <button
                            class="language-option active"
                            data-language="cpp"
                            type="button">

                            C++

                        </button>

                        <button
                            class="language-option"
                            data-language="java"
                            type="button">

                            Java

                        </button>

                        <button
                            class="language-option"
                            data-language="python"
                            type="button">

                            Python

                        </button>

                    </div>

                </div>

            </div>

        </header>



        <!-- MAIN -->

        <main class="workspace">


            <!-- LEFT -->

            <section class="editor-panel">

                <div class="panel-header">

                    <div class="panel-title-area">

                        <span class="panel-title">

                            Source Code

                        </span>

                        <span class="file-badge">

                            main.cpp

                        </span>

                    </div>

                    <span class="panel-language">

                        C++

                    </span>

                </div>


                <div class="editor-area">

                    <textarea

                        id="code"

                        spellcheck="false"

                        autocomplete="off"

                        autocorrect="off"

                        autocapitalize="off"

                        placeholder="#include<iostream>

using namespace std;

int main()
{

    cout << &quot;Hello World&quot;;

    return 0;

}"

                    ></textarea>

                </div>


                <div class="editor-footer">

                    <div class="editor-hint">

                        Write your C++ program and click Run Code.

                    </div>

                    <button

                        id="runBtn"

                        class="run-btn"

                        type="button">

                        <span class="run-icon">

                            ▶

                        </span>

                        Run Code

                    </button>

                </div>

            </section>



            <!-- RIGHT -->

            <section class="right-panel">


                <!-- INPUT -->

                <div class="input-panel">

                    <div class="panel-header">

                        <div class="panel-title-area">

                            <span class="panel-title">

                                Program Input

                            </span>

                        </div>

                        <span class="panel-language">

                            stdin

                        </span>

                    </div>

                    <div class="input-area">

                        <textarea

                            id="input"

                            spellcheck="false"

                            placeholder="Enter program input..."

                        ></textarea>

                    </div>

                </div>



                <!-- OUTPUT -->

                <div class="terminal-panel">

                    <div class="terminal-header">

                        <div class="terminal-title-area">

                            <div class="terminal-dots">

                                <span></span>

                                <span></span>

                                <span></span>

                            </div>

                            <span class="terminal-title">

                                Terminal / Output

                            </span>

                        </div>

                        <span

                            id="terminalStatus"

                            class="terminal-status">

                            Ready

                        </span>

                    </div>

                    <div class="terminal-body">

                        <pre id="output">

Program output will appear here...

                        </pre>

                    </div>

                </div>

            </section>

        </main>


        <!-- FOOTER -->

        <footer class="footer">

            <span>

                LexBridge © 2026

            </span>

            <span class="footer-separator">

                •

            </span>

            <span>

                C++ Compiler

            </span>

        </footer>

    </div>


    <script src="cpp_script.js"></script>

</body>

</html>
